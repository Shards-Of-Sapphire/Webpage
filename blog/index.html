<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ideas, lessons, and updates from the Sapphire team.">
  <meta name="theme-color" content="#05080f">
  <title>Sapphire Blog</title>
  <link rel="icon" type="image/png" href="../sapphire-icon.png" sizes="64x64">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;900&family=Source+Serif+4:wght@300;400;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="blog.css">
  <script defer src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script defer src="blog.js"></script>
</head>
<body>
  <header class="blog-header">
    <a class="brand" href="../" aria-label="Sapphire home">Sapphire</a>
    <nav aria-label="Blog navigation">
      <a href="../">Home</a>
      <a href="./" aria-current="page">All blogs</a>
    </nav>
  </header>

  <main class="blog-main">
    <section class="blog-intro" aria-labelledby="blog-title">
      <p class="eyebrow">Notes from Sapphire</p>
      <h1 id="blog-title">Stories, ideas &amp; <em>experiments</em></h1>
      <p>Thoughts and updates from our team as we learn, build, and grow.</p>
    </section>

    <section id="blog-listing" aria-label="All blog posts">
      <div id="allBlogPosts" class="blog-grid" data-source="../blogs/index.json" aria-live="polite">
        <p class="blog-status">Loading blog posts...</p>
      </div>
    </section>

    <article id="blog-article" class="blog-article" hidden>
      <a class="back-link" href="./"><i aria-hidden="true">&larr;</i> All blogs</a>
      <p class="eyebrow" id="article-meta"></p>
      <h1 id="article-title"></h1>
      <p class="article-summary" id="article-summary"></p>
      <img class="article-image" id="article-image" alt="" hidden>
      <div class="article-body" id="article-body"></div>
    </article>
  </main>

  <footer class="blog-footer">
    <a href="../">Back to Sapphire</a>
  </footer>
</body>
</html>
