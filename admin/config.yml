backend:
  name: github
  repo: Shards-Of-Sapphire/Webpage
  branch: main

site_url: https://shards-of-sapphire.github.io/Webpage
display_url: https://shards-of-sapphire.github.io/Webpage
media_folder: blog/uploads
public_folder: /Webpage/blog/uploads

collections:
  - name: blog
    label: Blog
    files:
      - name: posts
        label: Blog posts
        file: content/blog.json
        fields:
          - label: Posts
            name: posts
            widget: list
            summary: "{{fields.title}} — {{fields.date}}"
            fields:
              - label: Title
                name: title
                widget: string
              - label: URL slug
                name: slug
                widget: string
                pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Use lowercase letters, numbers, and hyphens only."]
                hint: "Lowercase letters, numbers, and hyphens only, for example: building-our-first-app"
              - label: Publish date
                name: date
                widget: datetime
                format: "YYYY-MM-DD"
                time_format: false
              - label: Author
                name: author
                widget: string
              - label: Summary
                name: summary
                widget: text
              - label: Cover image
                name: image
                widget: image
                required: false
              - label: Published
                name: published
                widget: boolean
                default: false
                hint: "Only published posts appear on the website."
              - label: Article
                name: body
                widget: markdown
